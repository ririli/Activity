x-common: &common
  restart: unless-stopped
  init: true
  networks: [default, ingress]
  volumes:
    - ./.local/keys/access.pub:/keys/access.pub:ro
  environment: &env
    HTTP_ADDR: :8080
    REDIS_ADDR: redis:6379
    AMQP_URL: amqp://activity:activity-local@rabbitmq:5672/
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters}
    IDENTITY_URL: http://identity:8080
    ACTIVITY_URL: http://activity:8080
    RANKING_URL: http://ranking:8080
    APP_ENV: local
    RATE_LIMIT_MODE: ${RATE_LIMIT_MODE:-enforce}
    SNOWFLAKE_CLOCK_WAIT: ${SNOWFLAKE_CLOCK_WAIT:-10ms}
    TRUSTED_PROXIES: ${PROXY_IP:-172.29.240.10}/32
    ACCESS_PUBLIC_KEY_FILE: /keys/access.pub
  depends_on: &shared-dependencies
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  identity:
    <<: *common
    depends_on:
      <<: *shared-dependencies
      mysql-identity: {condition: service_healthy}
    build: {context: ., args: {SERVICE: identity-service}}
    environment:
      <<: *env
      MYSQL_DSN: identity_app:dev-local-identity@tcp(mysql-identity:3306)/activity_identity
      NODE_ID: 1
      RATE_LIMIT_IDENTITY_ME_RATE: ${RATE_LIMIT_IDENTITY_ME_RATE:-5}
      RATE_LIMIT_IDENTITY_ME_CAPACITY: ${RATE_LIMIT_IDENTITY_ME_CAPACITY:-10}
      REGISTER_IP_WHITELIST: ${REGISTER_IP_WHITELIST:-}
      ACCESS_KEY_FILE: /keys/access.seed
      REFRESH_KEY_FILE: /keys/refresh.seed
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GRPC_ADDR: :9090
      REVOKE_NEGATIVE_TTL: 2s
      REVOKE_TTL_PADDING: 30s
    volumes:
      - ./.local/keys/access.seed:/keys/access.seed:ro
      - ./.local/keys/refresh.seed:/keys/refresh.seed:ro
  activity:
    <<: *common
    depends_on:
      <<: *shared-dependencies
      mysql-activity: {condition: service_healthy}
    build: {context: ., args: {SERVICE: activity-service}}
    environment:
      <<: *env
      MYSQL_DSN: core_app:dev-local-core@tcp(mysql-activity:3306)/activity_core
      NODE_ID: 2
      RATE_LIMIT_ACTIVITY_QUERY_RATE: ${RATE_LIMIT_ACTIVITY_QUERY_RATE:-10}
      RATE_LIMIT_ACTIVITY_QUERY_CAPACITY: ${RATE_LIMIT_ACTIVITY_QUERY_CAPACITY:-30}
      RATE_LIMIT_ACTIVITY_JOIN_RATE: ${RATE_LIMIT_ACTIVITY_JOIN_RATE:-5}
      RATE_LIMIT_ACTIVITY_JOIN_CAPACITY: ${RATE_LIMIT_ACTIVITY_JOIN_CAPACITY:-10}
      RATE_LIMIT_ACTIVITY_OPERATION_RATE: ${RATE_LIMIT_ACTIVITY_OPERATION_RATE:-2}
      RATE_LIMIT_ACTIVITY_OPERATION_CAPACITY: ${RATE_LIMIT_ACTIVITY_OPERATION_CAPACITY:-4}
  ranking:
    <<: *common
    build: {context: ., args: {SERVICE: ranking-service}}
    depends_on:
      mysql-ranking: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    environment:
      <<: *env
      MYSQL_DSN: ranking_app:dev-local-ranking@tcp(mysql-ranking:3306)/activity_ranking
      NODE_ID: 3
      RANKING_REDIS_SHARD_ADDRS: ${RANKING_REDIS_SHARD_ADDRS:-}
      RATE_LIMIT_RANKING_BOARD_RATE: ${RATE_LIMIT_RANKING_BOARD_RATE:-2}
      RATE_LIMIT_RANKING_BOARD_CAPACITY: ${RATE_LIMIT_RANKING_BOARD_CAPACITY:-5}
      IDENTITY_GRPC_ADDR: identity:9090
      PROFILE_TIMEOUT: 200ms
      PROFILE_CACHE_TTL: 60s
      PROFILE_CACHE_STALE_TTL: 10m
      PROFILE_CACHE_MAX: "10000"
  notification:
    <<: *common
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *env
      NODE_ID: 4
      NOTIFICATION_HUB_SHARDS: ${NOTIFICATION_HUB_SHARDS:-8}
      NOTIFICATION_MAX_CONNECTIONS: ${NOTIFICATION_MAX_CONNECTIONS:-10000}
      NOTIFICATION_SESSION_LIMIT: ${NOTIFICATION_SESSION_LIMIT:-5}
      NOTIFICATION_SHARD_QUEUE: ${NOTIFICATION_SHARD_QUEUE:-1024}
      NOTIFICATION_CONNECTION_QUEUE: ${NOTIFICATION_CONNECTION_QUEUE:-32}
      RATE_LIMIT_NOTIFICATION_STREAM_RATE: ${RATE_LIMIT_NOTIFICATION_STREAM_RATE:-0.2}
      RATE_LIMIT_NOTIFICATION_STREAM_CAPACITY: ${RATE_LIMIT_NOTIFICATION_STREAM_CAPACITY:-3}
  proxy:
    image: nginx:1.28-alpine
    networks:
      ingress:
        ipv4_address: ${PROXY_IP:-172.29.240.10}
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes:
      - ./deploy/local/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/h5/dist:/usr/share/nginx/html:ro
    depends_on: [identity, activity, ranking, notification]

networks:
  ingress:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.29.240.0/24}
