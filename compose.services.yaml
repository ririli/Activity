x-common: &common
  restart: unless-stopped
  init: true
  volumes:
    - ./.local/keys/access.pub:/keys/access.pub:ro
  environment: &env
    HTTP_ADDR: :8080
    REDIS_ADDR: redis:6379
    AMQP_URL: amqp://activity:activity-local@rabbitmq:5672/
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters}
    IDENTITY_URL: http://identity:8080
    ACTIVITY_URL: http://activity:8080
    RANKING_URL: http://ranking:8080
    APP_ENV: local
    ACCESS_PUBLIC_KEY_FILE: /keys/access.pub
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  mysql:
    volumes:
      - ./services/activity-service/migrations/003_ranking_projection.sql:/docker-entrypoint-initdb.d/022_core_projection.sql:ro
      - ./deploy/local/mysql/090_app_users.sql:/docker-entrypoint-initdb.d/090_users.sql:ro
  identity:
    <<: *common
    build: {context: ., args: {SERVICE: identity-service}}
    environment:
      <<: *env
      MYSQL_DSN: identity_app:dev-local-identity@tcp(mysql:3306)/activity_identity
      NODE_ID: 1
      TRUSTED_PROXIES: 172.16.0.0/12
      ACCESS_KEY_FILE: /keys/access.seed
      REFRESH_KEY_FILE: /keys/refresh.seed
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./.local/keys/access.seed:/keys/access.seed:ro
      - ./.local/keys/refresh.seed:/keys/refresh.seed:ro
  activity:
    <<: *common
    build: {context: ., args: {SERVICE: activity-service}}
    environment:
      <<: *env
      MYSQL_DSN: core_app:dev-local-core@tcp(mysql:3306)/activity_core
      NODE_ID: 2
  ranking:
    <<: *common
    build: {context: ., args: {SERVICE: ranking-service}}
    environment:
      <<: *env
      MYSQL_DSN: ranking_app:dev-local-ranking@tcp(mysql:3306)/activity_ranking
      NODE_ID: 3
  notification:
    <<: *common
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *env
      NODE_ID: 4
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes:
      - ./deploy/local/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [identity, activity, ranking, notification]


