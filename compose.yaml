name: activity-local

x-mysql: &mysql
  image: mysql:8.4
  command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 40s

services:
  mysql-identity:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${IDENTITY_MYSQL_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-activity-local-root}}
      MYSQL_DATABASE: activity_identity
      TZ: UTC
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - mysql_identity_data:/var/lib/mysql
      - ./services/identity-service/migrations/001_initial.sql:/docker-entrypoint-initdb.d/010_identity.sql:ro
      - ./services/identity-service/migrations/002_snowflake.sql:/docker-entrypoint-initdb.d/011_identity_snowflake.sql:ro
      - ./deploy/local/mysql/identity_user.sql:/docker-entrypoint-initdb.d/090_user.sql:ro
  mysql-activity:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ACTIVITY_MYSQL_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-activity-local-root}}
      MYSQL_DATABASE: activity_core
      TZ: UTC
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_activity_data:/var/lib/mysql
      - ./services/activity-service/migrations/001_initial.sql:/docker-entrypoint-initdb.d/020_activity.sql:ro
      - ./services/activity-service/migrations/002_records.sql:/docker-entrypoint-initdb.d/021_activity_records.sql:ro
      - ./services/activity-service/migrations/003_ranking_projection.sql:/docker-entrypoint-initdb.d/022_core_projection.sql:ro
      - ./services/activity-service/migrations/004_settlement_scheduling.sql:/docker-entrypoint-initdb.d/023_activity_settlement.sql:ro
      - ./services/activity-service/migrations/005_hourly_ranking.sql:/docker-entrypoint-initdb.d/024_activity_hourly.sql:ro
      - ./services/activity-service/migrations/006_snowflake.sql:/docker-entrypoint-initdb.d/025_activity_snowflake.sql:ro
      - ./deploy/local/mysql/activity_user.sql:/docker-entrypoint-initdb.d/090_user.sql:ro
  mysql-ranking:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${RANKING_MYSQL_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-activity-local-root}}
      MYSQL_DATABASE: activity_ranking
      TZ: UTC
    ports:
      - "127.0.0.1:13308:3306"
    volumes:
      - mysql_ranking_data:/var/lib/mysql
      - ./services/ranking-service/migrations/001_initial.sql:/docker-entrypoint-initdb.d/030_ranking.sql:ro
      - ./services/ranking-service/migrations/002_settlement_resume.sql:/docker-entrypoint-initdb.d/031_ranking_settlement.sql:ro
      - ./services/ranking-service/migrations/003_hourly_ranking.sql:/docker-entrypoint-initdb.d/032_ranking_hourly.sql:ro
      - ./services/ranking-service/migrations/004_snowflake.sql:/docker-entrypoint-initdb.d/033_ranking_snowflake.sql:ro
      - ./deploy/local/mysql/ranking_user.sql:/docker-entrypoint-initdb.d/090_user.sql:ro
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-activity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-activity-local}
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15673:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_identity_data:
  mysql_activity_data:
  mysql_ranking_data:
  redis_data:
  rabbitmq_data:
