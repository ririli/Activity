apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ranking-redis-client
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ranking}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {activity-role: ranking-data}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels: {activity-role: ranking-sentinel}
      ports: [{protocol: TCP, port: 26379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ranking-redis-data
spec:
  podSelector:
    matchLabels: {activity-role: ranking-data}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ranking}
        - podSelector:
            matchLabels: {activity-role: ranking-sentinel}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ranking-redis-sentinel
spec:
  podSelector:
    matchLabels: {activity-role: ranking-sentinel}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ranking}
        - podSelector:
            matchLabels: {activity-role: ranking-sentinel}
      ports: [{protocol: TCP, port: 26379}]
  egress:
    - to:
        - podSelector:
            matchLabels: {activity-role: ranking-sentinel}
      ports: [{protocol: TCP, port: 26379}]
    - to:
        - podSelector:
            matchLabels: {activity-role: ranking-data}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
