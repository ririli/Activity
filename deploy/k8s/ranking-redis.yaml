metadata:
  name: ranking-sentinel
spec:
  serviceName: ranking-sentinel
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ranking-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranking-sentinel
        app.kubernetes.io/part-of: activity
