apiVersion: v1
kind: Service
metadata:
  name: ranking-redis-0
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: ranking-redis-0
  ports:
    - {name: redis, port: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ranking-redis-0
spec:
  serviceName: ranking-redis-0
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ranking-redis-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranking-redis-0
        app.kubernetes.io/part-of: activity
        activity-role: ranking-data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ranking-redis-0
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [/bin/sh, /bootstrap/ranking-redis-entrypoint.sh, data]
          ports:
            - {name: redis, containerPort: 6379}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: REDIS_NODE_HOST
              value: "$(POD_NAME).ranking-redis-0.activity.svc.cluster.local"
            - name: RANKING_REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: ranking-redis-auth, key: password}}
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: ranking-redis-auth, key: password}}
            - name: REDIS_INITIAL_PRIMARY
              value: "ranking-redis-0-0.ranking-redis-0.activity.svc.cluster.local"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "750m", memory: "256Mi"}
          startupProbe:
            exec: {command: [redis-cli, -e, -p, "6379", ping]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [redis-cli, -e, -p, "6379", ping]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [redis-cli, -e, -p, "6379", ping]}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
      volumes:
        - name: bootstrap
          configMap: {name: ranking-redis-bootstrap}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}
---
