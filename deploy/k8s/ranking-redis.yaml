            - name: RANKING_REDIS_SENTINEL_PASSWORD
              valueFrom: {secretKeyRef: {name: ranking-sentinel-auth, key: password}}
            - name: REDIS_INITIAL_PRIMARIES
              value: >-
                ranking-redis-0-0.ranking-redis-0.activity.svc.cluster.local
                ranking-redis-1-0.ranking-redis-1.activity.svc.cluster.local
                ranking-redis-2-0.ranking-redis-2.activity.svc.cluster.local
                ranking-redis-3-0.ranking-redis-3.activity.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "25m", memory: "16Mi"}
            limits: {cpu: "150m", memory: "64Mi"}
          startupProbe:
            exec: {command: [redis-cli, -e, -p, "26379", ping]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [redis-cli, -e, -p, "26379", ping]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [redis-cli, -e, -p, "26379", ping]}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
      volumes:
        - name: bootstrap
          configMap: {name: ranking-redis-bootstrap}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}
