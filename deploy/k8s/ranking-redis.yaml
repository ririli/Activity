                matchLabels:
                  app.kubernetes.io/name: ranking-sentinel
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [/bin/sh, /bootstrap/ranking-redis-entrypoint.sh, sentinel]
          ports:
            - {name: redis, containerPort: 26379}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: REDIS_NODE_HOST
