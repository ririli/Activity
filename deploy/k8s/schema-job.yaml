apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "mysql-DB_SERVICE-schema-SCHEMA_VERSION"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "mysql-DB_SERVICE-schema-SCHEMA_VERSION"
    app.kubernetes.io/part-of: "activity"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "schema"
        app.kubernetes.io/part-of: "activity"
        activity-role: "database-job"
        database-service: "DB_SERVICE"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      restartPolicy: "Never"
      containers:
        -
          name: "run"
          image: "mysql:8.4"
          imagePullPolicy: "IfNotPresent"
          command:
            - "sh"
            - "-ec"
            - "until mysql -h mysql-DB_SERVICE -uroot -Nse 'SELECT 1'; do sleep 1; done; for f in /migrations/*.sql; do echo \"Applying $(basename \"$f\")\"; mysql -h mysql-DB_SERVICE -uroot < \"$f\"; done; if [ -f /bootstrap/090_users.sql ]; then mysql -h mysql-DB_SERVICE -uroot < /bootstrap/090_users.sql; fi"
          env:
            -
              name: "MYSQL_PWD"
              valueFrom:
                secretKeyRef:
                  name: "mysql-DB_SERVICE-root"
                  key: "password"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "migrations"
              mountPath: "/migrations"
              readOnly: true
            -
              name: "bootstrap"
              mountPath: "/bootstrap"
              readOnly: true
      volumes:
        -
          name: "migrations"
          configMap:
            name: "mysql-DB_SERVICE-migrations-SCHEMA_VERSION"
        -
          name: "bootstrap"
          secret:
            secretName: "mysql-DB_SERVICE-user-bootstrap-SCHEMA_VERSION"
            optional: BOOTSTRAP_OPTIONAL
