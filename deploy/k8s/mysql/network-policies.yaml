apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: split-mysql-database-jobs
spec:
  podSelector:
    matchLabels:
      activity-role: database-job
    matchExpressions:
      - key: database-service
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-service
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
