apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-identity-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql-service
      database-service: identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identity
        - podSelector:
            matchLabels:
              activity-role: database-job
              database-service: identity
      ports:
        - protocol: TCP
          port: 3306
---
