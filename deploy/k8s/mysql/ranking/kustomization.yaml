apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -ranking
resources:
  - ../base
labels:
  - pairs:
      database-service: ranking
    includeSelectors: true
patches:
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/serviceName
        value: mysql-ranking
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: mysql-ranking-root
