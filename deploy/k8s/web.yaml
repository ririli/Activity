apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "web"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "web"
    app.kubernetes.io/part-of: "activity"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: "web"
      app.kubernetes.io/part-of: "activity"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "web"
        app.kubernetes.io/part-of: "activity"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        -
          name: "web"
          image: "activity-k8s/web:dev"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          ports:
            -
              name: "http"
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "96Mi"
          readinessProbe:
            httpGet:
              path: "/nginx-health"
              port: "http"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/nginx-health"
              port: "http"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/nginx/conf.d"
              readOnly: true
            -
              name: "nginx-main"
              mountPath: "/etc/nginx/nginx.conf"
              subPath: "nginx.conf"
              readOnly: true
            -
              name: "tmp"
              mountPath: "/tmp"
            -
              name: "cache"
              mountPath: "/var/cache/nginx"
      volumes:
        -
          name: "config"
          configMap:
            name: "web-nginx"
        -
          name: "nginx-main"
          configMap:
            name: "web-main"
        -
          name: "tmp"
          emptyDir: {}
        -
          name: "cache"
          emptyDir: {}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "web"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "web"
    app.kubernetes.io/part-of: "activity"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "web"
    app.kubernetes.io/part-of: "activity"
  ports:
    -
      port: 8080
      targetPort: 8080
      name: "http"
---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "activity"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "activity"
    app.kubernetes.io/part-of: "activity"
spec:
  ingressClassName: "traefik"
  tls:
    -
      hosts:
        - "localhost"
      secretName: "local-tls"
  rules:
    -
      host: "localhost"
      http:
        paths:
          -
            path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "web"
                port:
                  number: 8080
