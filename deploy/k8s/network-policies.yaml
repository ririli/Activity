apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "default-deny"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "default-deny"
    app.kubernetes.io/part-of: "activity"
spec:
  podSelector: {}
  policyTypes:
    - "Ingress"
    - "Egress"
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "allow-dns"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "allow-dns"
    app.kubernetes.io/part-of: "activity"
spec:
  podSelector: {}
  policyTypes:
    - "Egress"
  egress:
    -
      to:
        -
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        -
          protocol: "UDP"
          port: 53
        -
          protocol: "TCP"
          port: 53
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "web-ingress"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "web-ingress"
    app.kubernetes.io/part-of: "activity"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "web"
  policyTypes:
    - "Ingress"
    - "Egress"
  ingress:
    -
      from:
        -
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "traefik"
      ports:
        -
          protocol: "TCP"
          port: 8080
  egress:
    -
      to:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "identity"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "activity"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "ranking"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "notification"
      ports:
        -
          protocol: "TCP"
          port: 8080
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "identity-traffic"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "identity-traffic"
    app.kubernetes.io/part-of: "activity"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "identity"
  policyTypes:
    - "Ingress"
    - "Egress"
  ingress:
    -
      from:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "web"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "identity"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "activity"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "ranking"
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "notification"
      ports:
        -
          protocol: "TCP"
          port: 8080
        -
          protocol: "TCP"
          port: 9090
  egress:
    -
      to:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "redis"
      ports:
        -
          protocol: "TCP"
          port: 6379
    -
      to:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "mysql"
      ports:
        -
          protocol: "TCP"
          port: 3306
    -
      to:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "rabbitmq"
      ports:
        -
          protocol: "TCP"
          port: 5672
    -
      to:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "identity"
      ports:
        -
          protocol: "TCP"
          port: 8080
        -
          protocol: "TCP"
          port: 9090
---
