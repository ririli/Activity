apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "app-config"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "app-config"
    app.kubernetes.io/part-of: "activity"
data:
  HTTP_ADDR: ":8080"
  APP_ENV: "k3s-learn"
  REDIS_ADDR: "redis:6379"
  IDENTITY_URL: "http://identity:8080"
  ACTIVITY_URL: "http://activity:8080"
  RANKING_URL: "http://ranking:8080"
  IDENTITY_GRPC_ADDR: "identity:9090"
  ACCESS_PUBLIC_KEY_FILE: "/keys/access.pub"
  TRUSTED_PROXIES: "10.42.0.0/16"
  ALLOWED_ORIGIN: "https://localhost:18443"
  COOKIE_SECURE: "true"
  RATE_LIMIT_MODE: "enforce"
  NOTIFICATION_MAX_CONNECTIONS: "1000"
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "mysql-config"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "mysql-config"
    app.kubernetes.io/part-of: "activity"
data:
  learning.cnf: "[mysqld]\nmax_connections=100\ninnodb_buffer_pool_size=256M\ncharacter-set-server=utf8mb4\ncollation-server=utf8mb4_0900_bin\n"
