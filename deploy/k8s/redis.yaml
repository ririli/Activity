apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "redis"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/part-of: "activity"
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "redis"
      app.kubernetes.io/part-of: "activity"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "redis"
        app.kubernetes.io/part-of: "activity"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "redis"
          image: "redis:7.4-alpine"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              containerPort: 6379
              name: "redis"
          env:
            -
              name: "REDISCLI_AUTH"
              valueFrom:
                secretKeyRef:
                  name: "redis-auth"
                  key: "password"
          command:
            - "sh"
            - "-c"
            - "exec redis-server --appendonly yes --requirepass \"$REDISCLI_AUTH\" --maxmemory 96mb --maxmemory-policy noeviction"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "192Mi"
          startupProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            -
              name: "data"
              mountPath: "/data"
      volumes: []
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "local-path"
        resources:
          requests:
            storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "redis"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/part-of: "activity"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/part-of: "activity"
  ports:
    -
      port: 6379
      targetPort: 6379
      name: "redis"
