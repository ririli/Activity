apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "activity-seed-v1"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "activity-seed-v1"
    app.kubernetes.io/part-of: "activity"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "seed"
        app.kubernetes.io/part-of: "activity"
        activity-role: "database-job"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      restartPolicy: "Never"
      containers:
        -
          name: "run"
          image: "activity-k8s/activity:dev"
          imagePullPolicy: "IfNotPresent"
          command:
            - "sh"
            - "-ec"
            - "for attempt in $(seq 1 30); do if nc -z -w 2 mysql 3306; then exec /seed; fi; sleep 1; done; echo 'MySQL is not reachable' >&2; exit 1"
          env:
            -
              name: "MYSQL_DSN"
              valueFrom:
                secretKeyRef:
                  name: "schema-core"
                  key: "MYSQL_DSN"
            -
              name: "NODE_ID"
              value: "100"
            -
              name: "EDITION_ID"
              value: "2026110601"
            -
              name: "EDITION_START"
              value: "2026-11-01T00:00:00+08:00"
            -
              name: "EDITION_END"
              value: "2026-12-01T00:00:00+08:00"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts: []
      volumes: []
