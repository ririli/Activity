apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "rabbitmq"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "rabbitmq"
    app.kubernetes.io/part-of: "activity"
spec:
  serviceName: "rabbitmq"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "rabbitmq"
      app.kubernetes.io/part-of: "activity"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "rabbitmq"
        app.kubernetes.io/part-of: "activity"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "rabbitmq"
          image: "rabbitmq:4.1-management"
          imagePullPolicy: "IfNotPresent"
          command:
            - "sh"
            - "-ec"
            - "if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 600 /var/lib/rabbitmq/.erlang.cookie; fi; exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server"
          ports:
            -
              containerPort: 5672
              name: "amqp"
            -
              containerPort: 15672
              name: "management"
          env:
            -
              name: "RABBITMQ_LOGS"
              value: "-"
            -
              name: "RABBITMQ_DEFAULT_USER"
              value: "activity"
            -
              name: "RABBITMQ_DEFAULT_PASS"
              valueFrom:
                secretKeyRef:
                  name: "rabbitmq-auth"
                  key: "password"
            -
              name: "RABBITMQ_ERLANG_COOKIE"
              valueFrom:
                secretKeyRef:
                  name: "rabbitmq-auth"
                  key: "cookie"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/rabbitmq"
            -
              name: "tmp"
              mountPath: "/tmp"
      volumes:
        -
          name: "tmp"
          emptyDir: {}
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "local-path"
        resources:
          requests:
            storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "rabbitmq"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "rabbitmq"
    app.kubernetes.io/part-of: "activity"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "rabbitmq"
    app.kubernetes.io/part-of: "activity"
  ports:
    -
      port: 5672
      targetPort: 5672
      name: "amqp"
