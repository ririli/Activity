# This file is included in the nginx http context.
# Empty keys exclude static files and internal/health paths from API quotas.
map $uri $api_ip { default ""; ~^/api/ $binary_remote_addr; }
map $uri $api_total { default ""; ~^/api/ "api"; }
map $uri $auth_ip { default ""; ~^/api/identity/v1/auth/(register|login)$ $binary_remote_addr; }
map $uri $auth_total { default ""; ~^/api/identity/v1/auth/(register|login)$ "auth"; }
map $uri $sse_ip { default ""; /api/notification/v1/barrage/stream $binary_remote_addr; }

limit_req_zone $api_ip zone=api_ip:10m rate=30r/s;
limit_req_zone $api_total zone=api_total:1m rate=100r/s;
limit_req_zone $auth_ip zone=auth_ip:10m rate=2r/s;
limit_req_zone $auth_total zone=auth_total:1m rate=5r/s;
limit_req_zone $sse_ip zone=sse_ip:10m rate=1r/s;
limit_conn_zone $sse_ip zone=sse_connections:10m;
log_format admission '$remote_addr "$request" $status '
                     'request_limit=$limit_req_status connection_limit=$limit_conn_status '
                     'request_time=$request_time upstream_time=$upstream_response_time';

server {
 set_real_ip_from 10.42.0.0/16;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 location = /nginx-health { access_log off; return 200 'ok'; }
 listen 8080;
 resolver 10.43.0.10 valid=5s;
 set $identity_backend http://identity.activity.svc.cluster.local:8080;
 set $activity_backend http://activity.activity.svc.cluster.local:8080;
 set $ranking_backend http://ranking.activity.svc.cluster.local:8080;
 set $notification_backend http://notification.activity.svc.cluster.local:8080;
 client_max_body_size 64k;
 access_log /var/log/nginx/access.log admission;

 # Every rule stays at one level; dedicated rules use empty keys elsewhere.
 limit_req zone=api_ip burst=60 nodelay;
 limit_req zone=api_total burst=50 nodelay;
 limit_req zone=auth_ip burst=5 nodelay;
 limit_req zone=auth_total burst=10 nodelay;
 limit_req zone=sse_ip burst=5 nodelay;
 limit_conn sse_connections 20;
 limit_req_status 429;
 limit_conn_status 429;
 # Enable both directives before enforcing limits on a deployment with users.
 limit_req_dry_run off;
 limit_conn_dry_run off;
 error_page 429 = @rate_limited;
 proxy_intercept_errors off;

 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;

 location /api/identity/ { proxy_pass $identity_backend; }
 location /api/activity/ { proxy_pass $activity_backend; }
 location /api/ranking/ { proxy_pass $ranking_backend; }
 location /api/notification/ {
   proxy_pass $notification_backend;
   proxy_http_version 1.1;
   # proxy_set_header is inherited only if none are set at this level.
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_cache off;
   gzip off;
   proxy_read_timeout 60s;
 }
 location @rate_limited {
   default_type application/json;
   add_header Retry-After 5 always;
   add_header Cache-Control no-store always;
   return 429 '{"error":"RATE_LIMITED"}';
 }
 location /api/ { return 404; }
 location /internal/ { return 404; }
 location /health/ { return 404; }
 location / {
   root /usr/share/nginx/html;
   index index.html;
   try_files $uri $uri/ /index.html;
 }
}
