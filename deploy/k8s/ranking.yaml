apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "ranking"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "ranking"
    app.kubernetes.io/part-of: "activity"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app.kubernetes.io/name: "ranking"
      app.kubernetes.io/part-of: "activity"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "ranking"
        app.kubernetes.io/part-of: "activity"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        -
          maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: "activity"
      containers:
        -
          name: "ranking"
          image: "activity-k8s/ranking:dev"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              name: "http"
              containerPort: 8080
          envFrom:
            -
              configMapRef:
                name: "app-config"
          env:
            - name: RANKING_REDIS_SENTINEL_ADDRS
              value: >-
                ranking-sentinel-0.ranking-sentinel.activity.svc.cluster.local:26379,ranking-sentinel-1.ranking-sentinel.activity.svc.cluster.local:26379,ranking-sentinel-2.ranking-sentinel.activity.svc.cluster.local:26379
            - name: RANKING_REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: ranking-redis-auth, key: password}}
            - name: RANKING_REDIS_SENTINEL_PASSWORD
              valueFrom: {secretKeyRef: {name: ranking-sentinel-auth, key: password}}
            -
              name: "NODE_ID"
              value: "3"
            -
              name: "INTERNAL_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "internal-auth"
                  key: "INTERNAL_TOKEN"
            -
              name: "AMQP_URL"
              valueFrom:
                secretKeyRef:
                  name: "rabbitmq-connection"
                  key: "AMQP_URL"
            -
              name: "REDIS_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "redis-auth"
                  key: "password"
            -
              name: "MYSQL_DSN"
              valueFrom:
                secretKeyRef:
                  name: "ranking-db"
                  key: "MYSQL_DSN"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: "/health/live"
              port: "http"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: "http"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            -
              name: "public-key"
              mountPath: "/keys"
              readOnly: true
            -
              name: "tmp"
              mountPath: "/tmp"
      volumes:
        -
          name: "public-key"
          configMap:
            name: "access-public-key"
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "32Mi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "ranking"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "ranking"
    app.kubernetes.io/part-of: "activity"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "ranking"
    app.kubernetes.io/part-of: "activity"
  ports:
    -
      port: 8080
      targetPort: 8080
      name: "http"
