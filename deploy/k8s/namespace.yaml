apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "activity"
  labels:
    pod-security.kubernetes.io/enforce: "baseline"
    pod-security.kubernetes.io/enforce-version: "v1.35"
    pod-security.kubernetes.io/warn: "restricted"
    pod-security.kubernetes.io/warn-version: "v1.35"
---
apiVersion: "v1"
kind: "ResourceQuota"
metadata:
  name: "activity-budget"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "activity-budget"
    app.kubernetes.io/part-of: "activity"
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "12"
    limits.memory: "6Gi"
    persistentvolumeclaims: "6"
    pods: "24"
---
apiVersion: "v1"
kind: "LimitRange"
metadata:
  name: "activity-defaults"
  namespace: "activity"
  labels:
    app.kubernetes.io/name: "activity-defaults"
    app.kubernetes.io/part-of: "activity"
spec:
  limits:
    -
      type: "Container"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "1"
        memory: "256Mi"
