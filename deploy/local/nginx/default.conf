server {
 listen 80;
 resolver 127.0.0.11 valid=5s;
 set $identity_backend http://identity:8080;
 set $activity_backend http://activity:8080;
 set $ranking_backend http://ranking:8080;
 set $notification_backend http://notification:8080;
 client_max_body_size 64k;
 location /api/identity/ { proxy_pass $identity_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location /api/activity/ { proxy_pass $activity_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location /api/ranking/ { proxy_pass $ranking_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location /api/notification/ {
   proxy_pass $notification_backend;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_cache off;
   gzip off;
   proxy_read_timeout 60s;
 }
 location / {
   root /usr/share/nginx/html;
   index index.html;
   try_files $uri $uri/ /index.html;
 }
}


